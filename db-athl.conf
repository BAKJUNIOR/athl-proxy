server {
    server_name  db.athl.athl-logistique.com;

    #access_log  /var/log/nginx/host.access.log  main;

    # Porte que Let's Encrypt utilise pour vérifier qu'on contrôle bien ce domaine.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_set_header Host $host;
        proxy_pass   http://athl-database-ihm:8080;
    }
}