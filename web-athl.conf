# Robots qui génèrent les aperçus de liens partagés (WhatsApp, LinkedIn, Facebook…). Ils
# n'exécutent pas le JavaScript : sur une fiche projet/actualité, ils reçoivent la page Open Graph
# générée par le back (ShareController) au lieu de la SPA vide. Googlebot n'est volontairement pas
# listé : il exécute le JS et doit voir exactement la même page que les visiteurs.
map $http_user_agent $is_share_bot {
    default                 0;
    ~*whatsapp              1;
    ~*facebookexternalhit   1;
    ~*facebot               1;
    ~*linkedinbot           1;
    ~*twitterbot            1;
    ~*telegrambot           1;
    ~*slackbot              1;
    ~*discordbot            1;
    ~*skypeuripreview       1;
    ~*viber                 1;
    ~*snapchat              1;
    ~*pinterest             1;
    ~*redditbot             1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # www.athl-logistique.com est le domaine final visé, mais son DNS ne pointe pas encore sur
    # ce serveur — site.athl-logistique.com est le domaine réellement utilisé pour les tests et
    # la présentation en attendant. Les deux sont servis ici pour ne rien casser le jour où le
    # DNS de www est repointé.
    server_name  athl-logistique.com www.athl-logistique.com site.athl-logistique.com;

    # Porte que Let's Encrypt utilise pour vérifier qu'on contrôle bien ce domaine (et pour le renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name  athl-logistique.com www.athl-logistique.com site.athl-logistique.com;

    ssl_certificate     /etc/letsencrypt/live/athl-logistique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athl-logistique.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_set_header Host $host;
        proxy_pass   http://athl-front;
    }

    # Fiches détail : même URL pour tout le monde, seuls les robots d'aperçu sont envoyés au back.
    location ~ ^/(?<share_section>projets|actualites)/(?<share_slug>[^/]+)/?$ {
        proxy_set_header Host $host;
        if ($is_share_bot) {
            rewrite ^ /share/$share_section/$share_slug break;
            proxy_pass http://athl_back:8080;
        }
        proxy_pass   http://athl-front;
    }

    location /imc {
        proxy_set_header Host $host;
        proxy_pass   http://athl_back:8080;
    }
}
