server {
    server_name  bo.athl-logistique.com;

    # Porte que Let's Encrypt utilise pour vérifier qu'on contrôle bien ce domaine.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_set_header Host $host;
        proxy_pass   http://athl-bo;
    }
}
